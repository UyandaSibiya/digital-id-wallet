<!-- Face Login Section -->
<div class="face-login-section mt-6 bg-gray-800 p-4 rounded-lg shadow-md text-center">
  <h3 class="text-xl font-semibold mb-4">Login with Face</h3>

  <!-- Camera stream -->
  <video id="loginVideo" width="280" height="200" autoplay class="mx-auto rounded"></video>
  <canvas id="loginCanvas" style="display:none;"></canvas>

  <button id="faceLoginBtn" 
          class="mt-4 bg-purple-500 hover:bg-purple-600 px-4 py-2 rounded">
    Login with Face
  </button>

  <!-- Hidden form to send captured face -->
  <form id="faceForm" action="{{ url_for('face_login') }}" method="POST" enctype="multipart/form-data" style="display:none;">
    <input type="file" name="face_image" id="faceInput">
  </form>
</div>

<script>
  const loginVideo = document.getElementById('loginVideo');
  const loginCanvas = document.getElementById('loginCanvas');
  const faceForm = document.getElementById('faceForm');
  const faceInput = document.getElementById('faceInput');

  // Start camera
  if (loginVideo) {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { loginVideo.srcObject = stream; })
      .catch(err => console.error("Camera error:", err));
  }

  // Capture face and submit form
  document.getElementById('faceLoginBtn')?.addEventListener('click', () => {
    const context = loginCanvas.getContext('2d');
    loginCanvas.width = loginVideo.videoWidth;
    loginCanvas.height = loginVideo.videoHeight;
    context.drawImage(loginVideo, 0, 0, loginCanvas.width, loginCanvas.height);

    loginCanvas.toBlob(blob => {
      const file = new File([blob], "face_login.png", { type: "image/png" });

      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      faceInput.files = dataTransfer.files;

      faceForm.submit();
    }, "image/png");
  });
</script>
