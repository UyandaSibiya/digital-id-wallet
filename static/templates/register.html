<form id="register-form" action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data" autocomplete="on">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" placeholder="Email" required />

    <label for="username">Username</label>
    <input type="text" name="username" id="username" placeholder="Username" required />

    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="Password" required />

    <!-- Face Capture Section -->
    <div class="face-register-section">
        <h4>Capture Your Face</h4>
        <video id="regVideo" width="280" height="200" autoplay></video>
        <canvas id="regCanvas" style="display:none;"></canvas>
        <button type="button" id="captureFaceBtn">Capture Face</button>
        <input type="hidden" name="face_image_name" id="faceImageName">
    </div>

    <button type="submit">Register</button>
</form>

<p>
    Already have an account? <a href="{{ url_for('login') }}">Login here</a>
</p>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<script>
  // Camera setup
  const regVideo = document.getElementById('regVideo');
  const regCanvas = document.getElementById('regCanvas');
  const faceImageNameInput = document.getElementById('faceImageName');

  if (regVideo) {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { regVideo.srcObject = stream; })
      .catch(err => console.error("Camera error:", err));
  }

  // Capture face
  document.getElementById('captureFaceBtn').addEventListener('click', () => {
    const context = regCanvas.getContext('2d');
    regCanvas.width = regVideo.videoWidth;
    regCanvas.height = regVideo.videoHeight;
    context.drawImage(regVideo, 0, 0, regCanvas.width, regCanvas.height);

    const imageName = `face_${Date.now()}.png`;
    faceImageNameInput.value = imageName;

    // Convert canvas to blob and attach to form
    const blob = dataURLtoBlob(regCanvas.toDataURL("image/png"));
    const file = new File([blob], imageName, { type: "image/png" });
    const dataTransfer = new DataTransfer();
    dataTransfer.items.add(file);

    const input = document.createElement('input');
    input.type = 'file';
    input.name = 'face_image';
    input.files = dataTransfer.files;
    input.style.display = 'none';
    document.getElementById('register-form').appendChild(input);

    alert("Face captured! Now submit the form to register.");
  });

  function dataURLtoBlob(dataurl) {
    const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
          bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
    while(n--){ u8arr[n] = bstr.charCodeAt(n); }
    return new Blob([u8arr], {type:mime});
  }
</script>
